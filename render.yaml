services:
  - type: web
    name: lever-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: CORS_ORIGIN
        value: "https://lever-longshort.vercel.app,https://jb-dash.vercel.app"
      - key: HL_INFO_URL
        value: "https://api.hyperliquid.xyz/info"